<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Criador de fichas de personagem para Pathfinder 2e Remaster. Interface moderna e intuitiva para criação e gerenciamento de personagens.">
    <meta name="keywords" content="Pathfinder 2e, PF2e, Remaster, RPG, ficha, personagem, criador, Pathfinder, tabletop">
    <meta name="author" content="PF2e Remaster App">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gacoelho.github.io/pathfinder2E_app/">
    <meta property="og:title" content="PF2e Remaster - Criador de Fichas de Personagem">
    <meta property="og:description" content="Crie e gerencie fichas de personagem para Pathfinder 2e Remaster com interface moderna e intuitiva.">
    <meta property="og:image" content="https://gacoelho.github.io/pathfinder2E_app/assets/icon.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://gacoelho.github.io/pathfinder2E_app/">
    <meta property="twitter:title" content="PF2e Remaster - Criador de Fichas de Personagem">
    <meta property="twitter:description" content="Crie e gerencie fichas de personagem para Pathfinder 2e Remaster com interface moderna e intuitiva.">
    <meta property="twitter:image" content="https://gacoelho.github.io/pathfinder2E_app/assets/icon.png">

    <title>PF2e Remaster - Criador de Fichas de Personagem</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#7c3aed">
    <meta name="msapplication-TileColor" content="#7c3aed">
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Custom styles for loading screen -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            overflow-x: hidden;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3);
            animation: pulse 2s infinite;
        }
        
        .loading-title {
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .loading-subtitle {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 32px;
            text-align: center;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-features {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            opacity: 0.6;
        }
        
        .loading-feature {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #64748b;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Hide loading screen when app loads */
        .app-loaded #loading-screen {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .loading-title {
                font-size: 20px;
            }
            
            .loading-subtitle {
                font-size: 14px;
                padding: 0 20px;
            }
            
            .loading-features {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-logo">🎲</div>
        <div class="loading-title">Pathfinder 2e Remaster</div>
        <div class="loading-subtitle">Carregando criador de fichas...</div>
        <div class="loading-spinner"></div>
        <div class="loading-features">
            <div class="loading-feature">
                <span>⚔️</span>
                <span>Ficha Completa</span>
            </div>
            <div class="loading-feature">
                <span>💾</span>
                <span>Salvamento Local</span>
            </div>
            <div class="loading-feature">
                <span>📱</span>
                <span>Responsivo</span>
            </div>
        </div>
    </div>
    
    <div id="root"></div>
    
    <script>
        // Hide loading screen when the app is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.body.classList.add('app-loaded');
            }, 1000);
        });
        
        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
